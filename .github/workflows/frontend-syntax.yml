name: CargoDek frontend syntax check

on:
  push:
    paths:
      - "index.html"
      - "scripts/validate-frontend.js"
      - ".github/workflows/frontend-syntax.yml"
  pull_request:
    paths:
      - "index.html"
      - "scripts/validate-frontend.js"
      - ".github/workflows/frontend-syntax.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate CargoDek frontend
        run: node scripts/validate-frontend.js
